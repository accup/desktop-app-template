name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cargo fmt
            cmd: cargo fmt --all -- --check
          - name: cargo check
            cmd: cargo check --workspace --all-targets
          - name: cargo test
            cmd: cargo test --workspace --all-targets
          - name: cargo clippy
            cmd: cargo clippy --workspace --all-targets -- -D warnings
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: ${{ matrix.cmd }}

  pnpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pnpm run format
            cmd: pnpm run format --check
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-node
      - run: ${{ matrix.cmd }}
