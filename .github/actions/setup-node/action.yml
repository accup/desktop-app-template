name: checkout

description: Setup Node.js and pnpm

runs:
  using: "composite"
  steps:
    - id: version
      name: Read the pnpm version from the package.json file
      shell: bash
      run: |
        pnpm=$(cat ./package.json | jq -c -r '.devEngines.packageManager.version')
        node=$(cat ./package.json | jq -c -r '.devEngines.runtime.version')
        echo "pnpm=$pnpm" >> "$GITHUB_OUTPUT"
        echo "node=$node" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm
      uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a
      with:
        version: ${{ steps.version.outputs.pnpm }}
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ steps.version.outputs.node }}
        cache: "pnpm"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
