name: setup-just

description: Setup just

runs:
  using: "composite"
  steps:
    - id: version
      name: Read the just version from the devcontainer Dockerfile
      shell: bash
      run: |
        version=$(sed -n 's/^ARG JUST_VERSION=//p' ./.devcontainer/Dockerfile)
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install just
      shell: bash
      env:
        JUST_VERSION: ${{ steps.version.outputs.version }}
      run: |
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            asset="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            sha256="fa2a8ec1015d9df5330941ade12437488fc40d33f9c9f8cd4eb70a26de11b639"
            ;;
          macOS-ARM64)
            asset="just-${JUST_VERSION}-aarch64-apple-darwin.tar.gz"
            sha256="f35798d4bcdc4db020eef7d2853ad98bbfb97a4d29ee695ba042f18e7fedcc11"
            ;;
          Windows-X64)
            asset="just-${JUST_VERSION}-x86_64-pc-windows-msvc.zip"
            sha256="804f5b2fe94291d0df38fd8dfc5620afbf3496f8f11c1915b42a87323234f0ba"
            ;;
          *)
            echo "unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac
        BIN_DIR="${RUNNER_TEMP}/just-bin"
        TMP_ARCHIVE="${RUNNER_TEMP}/${asset}"
        mkdir -p "${BIN_DIR}"
        curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/${asset}" -o "${TMP_ARCHIVE}"
        echo "${sha256} *${TMP_ARCHIVE}" | sha256sum -c -
        case "${asset}" in
          *.tar.gz) tar -xzf "${TMP_ARCHIVE}" -C "${BIN_DIR}" just ;;
          *.zip) 7z x -y -o"${BIN_DIR}" "${TMP_ARCHIVE}" > /dev/null ;;
        esac
        echo "${BIN_DIR}" >> "$GITHUB_PATH"
